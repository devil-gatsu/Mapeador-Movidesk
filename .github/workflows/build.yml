name: Compilar Executável

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Copiar código do repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Instalar navegadores do Playwright
      run: |
        playwright install chromium

    - name: Gerar executável com PyInstaller
      run: |
        pyinstaller --noconsole --onefile --name="MapeadorMovidesk" main.py

    - name: Salvar o .exe gerado
      uses: actions/upload-artifact@v4
      with:
        name: MapeadorMovidesk-Exe
        path: dist/MapeadorMovidesk.exe
